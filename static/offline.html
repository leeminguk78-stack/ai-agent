<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#181b22">
<title>Агент не запущен</title>
<style>
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#0f1115;color:#e6e8ee;font:16px/1.5 system-ui,sans-serif;padding:24px;box-sizing:border-box}
.c{max-width:420px;text-align:center}
img{width:96px;height:96px;border-radius:24px}
h2{margin:16px 0 8px}
p{color:#a4aabb;margin:8px 0}
code{display:block;background:#181b22;border:1px solid #262a33;border-radius:10px;padding:12px;margin:14px 0;font:15px ui-monospace,monospace;color:#e6e8ee;user-select:all}
button{background:#5b8cff;color:#fff;border:0;border-radius:12px;padding:12px 24px;font:inherit;margin-top:8px}
</style></head><body>
<div class="c">
<img src="/icon-192.png" alt="">
<h2>Агент не запущен</h2>
<div id="app" style="display:none">
<p>Нажми кнопку — приложение запустит агента в Termux.</p>
<button onclick="AgentApp.startAgent()">▶ Запустить агента</button>
<p id="st" style="color:#ffd9a0"></p>
</div>
<div id="manual">
<p>Открой Termux и выполни команду:</p>
<code>bash ~/agent-app/start.sh</code>
<p>Если Android закрыл Termux, просто открой его снова — команда та же.</p>
</div>
<button onclick="location.reload()">Повторить</button>
</div>
<script>
function setStatus(t){document.getElementById('st').textContent=t}
if(window.AgentApp){document.getElementById('app').style.display='block';document.getElementById('manual').style.display='none'}
</script>
</body></html>
